services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gophkeeper
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: gophkeeper
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOPHKEEPER_SERVER_HOST: 0.0.0.0
      GOPHKEEPER_SERVER_PORT: 8080
      GOPHKEEPER_SERVER_STORAGE: postgres
      GOPHKEEPER_SERVER_DSN: postgresql://gophkeeper:gophkeeper@db:5432/gophkeeper?sslmode=disable
      GOPHKEEPER_SERVER_JWT_KEY: dev-secret
      GOPHKEEPER_LOG_LEVEL: info
      GOPHKEEPER_LOG_FORMAT: text
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
